name: Bug report
description: Report a reproducible problem in the public framework
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach API keys, private media, model weights or chat history.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest public-only reproduction.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Node.js, OS and Xiaoya Framework version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
